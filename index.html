<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <h1>Snake</h1>
    <div class="scoreboard">
      <span>Punti: <strong id="score">0</strong></span>
      <span>Record: <strong id="best">0</strong></span>
    </div>
    <canvas id="board" width="400" height="400"></canvas>
    <div class="pad" aria-label="Controlli touch">
      <button data-dir="up" aria-label="Su">▲</button>
      <button data-dir="left" aria-label="Sinistra">◀</button>
      <button data-dir="down" aria-label="Giù">▼</button>
      <button data-dir="right" aria-label="Destra">▶</button>
    </div>
    <p class="hint">Frecce, swipe o pulsanti per muoverti</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
